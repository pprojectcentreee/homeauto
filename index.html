<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velammal Engineering College - Home Automation</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#050816,#0b1229,#0f1f45);
color:#eaf2ff;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:1100px;
background:rgba(10,18,40,0.88);
border:1px solid rgba(100,149,237,0.25);
border-radius:24px;
box-shadow:0 0 30px rgba(0,140,255,0.15);
overflow:hidden;
backdrop-filter:blur(10px);
}

.header{
padding:28px 24px;
text-align:center;
background:linear-gradient(90deg,rgba(8,28,70,0.95),rgba(14,55,130,0.95));
border-bottom:1px solid rgba(120,180,255,0.25);
}

.header h1{
font-size:2rem;
color:#ffffff;
letter-spacing:1px;
margin-bottom:8px;
}

.header p{
color:#a9c8ff;
font-size:1rem;
}

.status-bar{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
padding:16px;
background:rgba(7,17,38,0.95);
border-bottom:1px solid rgba(120,180,255,0.15);
}

.dot{
width:12px;
height:12px;
border-radius:50%;
background:orange;
box-shadow:0 0 10px orange;
}

.status-text{
font-weight:600;
color:#d9e8ff;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:22px;
padding:28px;
}

.card{
background:linear-gradient(180deg,rgba(12,24,55,0.95),rgba(8,16,35,0.95));
border:1px solid rgba(76,146,255,0.25);
border-radius:18px;
padding:20px;
text-align:center;
box-shadow:inset 0 0 20px rgba(0,102,255,0.07),0 0 18px rgba(0,80,180,0.08);
transition:transform 0.25s ease,box-shadow 0.25s ease;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 0 22px rgba(0,140,255,0.18);
}

.device-title{
font-size:1.2rem;
margin-bottom:14px;
color:#ffffff;
}

.state{
margin-bottom:18px;
font-size:1rem;
color:#9dc2ff;
font-weight:600;
}

.btn-group{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

button{
border:none;
outline:none;
padding:12px 22px;
border-radius:12px;
font-size:0.95rem;
font-weight:700;
cursor:pointer;
transition:all 0.25s ease;
min-width:90px;
}

.on-btn{
background:linear-gradient(90deg,#0b84ff,#33a1ff);
color:white;
box-shadow:0 0 14px rgba(0,140,255,0.25);
}

.on-btn:hover{
background:linear-gradient(90deg,#1990ff,#58b4ff);
transform:scale(1.04);
}

.off-btn{
background:linear-gradient(90deg,#1b2947,#243b69);
color:#dce9ff;
border:1px solid rgba(102,163,255,0.2);
}

.off-btn:hover{
background:linear-gradient(90deg,#263f71,#315291);
transform:scale(1.04);
}

.footer{
text-align:center;
padding:18px;
color:#88aee8;
border-top:1px solid rgba(120,180,255,0.12);
background:rgba(6,14,32,0.9);
font-size:0.92rem;
}

@media(max-width:600px){

.header h1{
font-size:1.4rem;
}

.grid{
padding:18px;
gap:16px;
}

button{
width:100%;
}

.btn-group{
flex-direction:column;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>Velammal Engineering College</h1>
<p>Home Automation Control Panel</p>
</div>

<div class="status-bar">
<div class="dot" id="statusDot"></div>
<div class="status-text" id="connectionStatus">Connecting to MQTT...</div>
</div>

<div class="grid">

<div class="card">
<div class="device-title">Relay 1</div>
<div class="state" id="state1">Status: Unknown</div>
<div class="btn-group">
<button class="on-btn" onclick="sendCommand(1,'ON')">ON</button>
<button class="off-btn" onclick="sendCommand(1,'OFF')">OFF</button>
</div>
</div>

<div class="card">
<div class="device-title">Relay 2</div>
<div class="state" id="state2">Status: Unknown</div>
<div class="btn-group">
<button class="on-btn" onclick="sendCommand(2,'ON')">ON</button>
<button class="off-btn" onclick="sendCommand(2,'OFF')">OFF</button>
</div>
</div>

<div class="card">
<div class="device-title">Relay 3</div>
<div class="state" id="state3">Status: Unknown</div>
<div class="btn-group">
<button class="on-btn" onclick="sendCommand(3,'ON')">ON</button>
<button class="off-btn" onclick="sendCommand(3,'OFF')">OFF</button>
</div>
</div>

<div class="card">
<div class="device-title">Relay 4</div>
<div class="state" id="state4">Status: Unknown</div>
<div class="btn-group">
<button class="on-btn" onclick="sendCommand(4,'ON')">ON</button>
<button class="off-btn" onclick="sendCommand(4,'OFF')">OFF</button>
</div>
</div>

</div>

<div class="footer">
Secure MQTT Home Automation Dashboard
</div>

</div>

<script>

const brokerUrl="wss://k6157600.ala.us-east-1.emqxsl.com:8084/mqtt";

const options={
username:"girish123",
password:"girish123",
clean:true,
connectTimeout:4000,
clientId:"webclient_"+Math.random().toString(16).substr(2,8),
reconnectPeriod:2000
};

const client=mqtt.connect(brokerUrl,options);

const connectionStatus=document.getElementById("connectionStatus");
const statusDot=document.getElementById("statusDot");

client.on("connect",()=>{

connectionStatus.textContent="Connected to MQTT Broker";

statusDot.style.background="#00ff99";
statusDot.style.boxShadow="0 0 10px #00ff99";

client.subscribe("home/+/state");

});

client.on("reconnect",()=>{

connectionStatus.textContent="Reconnecting...";
statusDot.style.background="orange";
statusDot.style.boxShadow="0 0 10px orange";

});

client.on("error",(err)=>{

connectionStatus.textContent="Connection Error";
statusDot.style.background="red";
statusDot.style.boxShadow="0 0 10px red";

console.error(err);

});

client.on("message",(topic,message)=>{

const msg=message.toString();

const parts=topic.split("/");

const relayNumber=parts[1].replace("relay","");

const element=document.getElementById("state"+relayNumber);

if(element)
element.textContent="Status: "+msg;

});

function sendCommand(relay,command){

const topic=`home/relay${relay}/set`;

client.publish(topic,command);

}

</script>

</body>
</html>
